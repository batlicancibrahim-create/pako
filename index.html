<style>
:root{color-scheme:dark;--night:#1c1024;--plum:#2b1936;--line:#4c3259;--paper:#fff4e8;--text:#f7ecf2;--muted:#bfa9c4;--candle:#f7c65c;--rose:#ff86a8;--seal:#c2344d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night)}
body{font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--text);font:16px/1.5 "Nunito",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(900px 420px at 50% -80px,#3b1f45 0%,transparent 70%),var(--night)}
main{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.env{position:relative;width:150px;aspect-ratio:4/3;border-radius:10px;background:var(--paper);box-shadow:0 18px 40px -20px #000}
.env::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);background:#f0dcc6;border-radius:10px 10px 0 0}
.seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#e0566d,var(--seal) 60%,#8e1f33);color:#ffe9ee;font:900 22px "Fraunces",Georgia,serif;box-shadow:0 2px 0 #0003}
h1{margin:0;font:900 clamp(30px,9vw,40px)/1.05 "Fraunces",Georgia,serif}
h1 em{font-style:normal;color:var(--rose)}
p{margin:0;color:var(--muted)}
form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4px}
input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--plum);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:center}
input[type=text]:focus{outline:2px solid var(--candle);outline-offset:2px;border-color:transparent}
label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:800;font-size:17px;background:var(--candle);color:#3b2600;border:0;border-radius:999px;padding:13px 20px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--rose);font-weight:700;min-height:1.5em}
.hint{color:var(--text);font-size:15px;background:var(--plum);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.hint b{color:var(--candle)}
.hand{font-family:"Caveat",cursive;font-size:22px;color:var(--candle)}
</style>
</head>
<body>
<main id="gate" hidden>
  <div class="env" aria-hidden="true"><span class="seal">P</span></div>
  <h1>Pako'nun <em>haftası</em></h1>
  <p>Bu zarf mühürlü. Şifre üç kelime, aralarında boşluk:</p>
  <p class="hint">En sevdiğin <b>renk</b> · en sevdiğin <b>yemek</b> · en nefret ettiğin <b>dizi karakteri</b></p>
  <form id="f">
    <input type="text" id="pw" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="renk yemek karakter" aria-label="Şifre" required>
    <label><input type="checkbox" id="rem" checked> Bu telefonda hatırla</label>
    <button id="go">Zarfı aç</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <span class="hand">Seni seviyorum.</span>
</main>

  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var hex = function(u){ return Array.from(u, function(x){ return x.toString(16).padStart(2, "0"); }).join(""); };
  var unhex = function(h){ return new Uint8Array(h.match(/../g).map(function(x){ return parseInt(x, 16); })); };
  var KEY = "pako:anahtar";
  function norm(s){ return s.normalize("NFC").toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g, function(c){ return {"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"}[c]; }).split(" ").filter(Boolean).join(" "); }
  var ls = { get:function(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
             set:function(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
             del:function(){ try { localStorage.removeItem(KEY); } catch(e){} } };
  function derive(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveBits"])
      .then(function(base){ return crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, 256); })
      .then(function(bits){ return new Uint8Array(bits); });
  }
  function open(raw){
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct)); })
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  var gate = document.getElementById("gate"), f = document.getElementById("f"), pw = document.getElementById("pw"),
      err = document.getElementById("err"), go = document.getElementById("go"), rem = document.getElementById("rem");
  function showGate(){ gate.hidden = false; }
  if (!window.crypto || !crypto.subtle){ showGate(); err.textContent = "Bu tarayıcı zarfı açamıyor. Safari ya da Chrome ile dene."; go.disabled = true; return; }
  var saved = ls.get();
  if (saved && saved.salt === P.salt && saved.k){ open(unhex(saved.k)).then(show, function(){ ls.del(); showGate(); }); }
  else showGate();
  f.addEventListener("submit", function(e){
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Açılıyor…";
    var raw;
    derive(pw.value).then(function(r){ raw = r; return open(r); })
      .then(function(html){ if (rem.checked) ls.set({salt:P.salt, k:hex(raw)}); show(html); })
      .catch(function(){ go.disabled = false; go.textContent = "Zarfı aç"; err.textContent = "Olmadı. Bir daha dene."; pw.select(); });
  });
})();
